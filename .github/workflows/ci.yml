name: Django Minify Compress StaticFiles CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Python ${{ matrix.python-version }} with Django ${{ matrix.django-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        django-version: ["django~=5.2.0", "django~=6.0.0", "django~=6.1.0"]
        exclude:
          # Django 6.0 and 6.1 require Python 3.12+
          - python-version: "3.11"
            django-version: "django~=6.0.0"
          - python-version: "3.11"
            django-version: "django~=6.1.0"
        include:
          - python-version: "3.13"
            django-version: "django~=6.1.0"
            review_default: true # Used by on-demand AI reviews
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        id: python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Identify runner image
        id: platform
        run: echo "image_os=$ImageOS" >> "$GITHUB_OUTPUT"

      - name: Cache pip packages
        id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pip
          key: >-
            ${{ format('{0}-{1}-{2}-pip-{3}-{4}-{5}', runner.os, runner.arch,
                steps.platform.outputs.image_os, steps.python.outputs.python-version,
                matrix.django-version, hashFiles('setup.py', 'install-ci-deps.sh')) }}

      - name: Install Python dependencies
        id: deps
        env:
          DJANGO_VERSION: ${{ matrix.django-version }}
        run: ./install-ci-deps.sh

      - name: Run tests
        if: ${{ !cancelled() && steps.deps.conclusion == 'success' }}
        run: |
          coverage run ./runtests
          coverage combine
          coverage xml
          coverage report

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: ./coverage.xml
          flag-name: python-${{ matrix.python-version }}-django-${{ matrix.django-version }}
          parallel: true

  qa:
    name: Run QA checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        env:
          CI_QA: "1"
        run: ./install-ci-deps.sh

      - name: Run QA checks
        run: ./run-qa-checks

  finish:
    name: Finalize Coveralls report
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@8d6379e14d29928660c4ba802d8e85393440b329 # v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
